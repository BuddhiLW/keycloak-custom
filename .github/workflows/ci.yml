# The golden test is only a gate if something runs it. A template edit that
# changes any tenant's rendered stylesheet fails here, in the PR, rather than in
# the shared Keycloak instance.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # go.mod carries one dependency; a stray require or a missing sum should
      # not reach a tag.
      - name: tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
